[project]
name = "pg-mcp-guard"
version = "0.1.0"
description = "MCP server for read-only SQL on PostgreSQL, where safety is enforced by the database first and a SQL validator second."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pins: the MCP SDK defines our protocol surface and pglast's parse
    # tree defines the validator's security semantics. Bumping either is a
    # deliberate commit with a full test run (ADR 0001).
    "mcp==2.3.0",
    "pglast==8.7",
    "psycopg[binary,pool]>=3.3",
    "pydantic-settings>=2.16",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false
# Supply-chain hygiene: resolve only package versions published before this date
# (applies to every direct and transitive dependency). Freshly published
# releases get time for problems to surface before we adopt them. Bump the date
# deliberately when updating dependencies, then re-run the full test suite.
exclude-newer = "2026-10-26T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; fixed test values are not secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "known_gap: documents a residual risk that exists at this layer (see ADR 0002); passes while the gap exists",
]
