[[case]]
id = "hidden_table_in_exists"
sql = 'SELECT * FROM orders WHERE EXISTS (SELECT 1 FROM shop.users)'
verdict = "reject"
reason = "relation_not_allowed: shop.users"

[[case]]
id = "hidden_table_in_union"
sql = 'SELECT id FROM orders UNION SELECT id FROM users'
verdict = "reject"
reason = "relation_not_allowed: users"

[[case]]
id = "hidden_table_in_lateral"
sql = 'SELECT * FROM orders o, LATERAL (SELECT email FROM users) u'
verdict = "reject"
reason = "relation_not_allowed: users"

[[case]]
id = "hidden_table_in_cte"
sql = 'WITH m AS (SELECT * FROM memberships) SELECT * FROM m'
verdict = "reject"
reason = "relation_not_allowed: memberships"
