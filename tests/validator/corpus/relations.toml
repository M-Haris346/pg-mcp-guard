# Relations not on the allowlist: catalogs, hidden tables, other schemas.

[[case]]
id = "pg_class_qualified"
sql = 'SELECT * FROM pg_catalog.pg_class'
verdict = "reject"
reason = "relation_not_allowed: pg_catalog.pg_class"

[[case]]
id = "pg_class_unqualified"
sql = 'SELECT relname FROM pg_class'
verdict = "reject"
reason = "relation_not_allowed: pg_class"
note = "pg_catalog is searched first even when search_path = shop"

[[case]]
id = "pg_stat_activity"
sql = 'SELECT query FROM pg_stat_activity'
verdict = "reject"
reason = "relation_not_allowed: pg_stat_activity"
db_test = "test_reader_cannot_see_another_reader_sessions_query_or_token"

[[case]]
id = "pg_stat_activity_outright"
sql = 'SELECT query FROM pg_stat_activity'
verdict = "reject"
reason = "relation_not_allowed: pg_stat_activity"
db_test = "test_activity_views_are_denied_outright"

[[case]]
id = "pg_locks"
sql = 'SELECT DISTINCT pid FROM pg_locks'
verdict = "reject"
reason = "relation_not_allowed: pg_locks"
note = "ADR 0002 residual risk 5: lists other sessions' pids at the DB layer"

