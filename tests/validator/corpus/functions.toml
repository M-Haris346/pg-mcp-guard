# Functions not on the allowlist (deny by default).

[[case]]
id = "set_config_forged_context"
sql = '''SELECT set_config('mcpguard.ctx', 'v1.forged', true)'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_forged_context_sees_nothing_and_does_not_error"
note = "rule 4: the impersonation attempt"

[[case]]
id = "set_config_forged_context_in_where"
sql = '''SELECT * FROM orders WHERE set_config('mcpguard.ctx', 'v1.forged', true) IS NOT NULL'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_forged_context_sees_nothing_and_does_not_error"

[[case]]
id = "set_config_replay_own_token"
sql = '''SELECT set_config('mcpguard.ctx', current_setting('mcpguard.ctx'), true)'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_reader_can_replay_its_own_valid_token_only_for_its_tenant"

[[case]]
id = "set_config_statement_timeout_session"
sql = '''SELECT set_config('statement_timeout','0',false)'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_reader_sql_cannot_change_its_own_settings"
note = "also closed at the DB layer: set_config is revoked from the reader"

[[case]]
id = "set_config_statement_timeout_local"
sql = '''SELECT set_config('statement_timeout', '0', true)'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_reader_sql_cannot_change_its_own_settings"

[[case]]
id = "set_config_temp_file_limit"
sql = '''SELECT set_config('temp_file_limit', '-1', false)'''
verdict = "reject"
reason = "function_not_allowed: set_config"
db_test = "test_reader_cannot_raise_temp_file_limit"

