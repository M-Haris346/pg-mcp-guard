[[case]]
id = "drop_policy"
sql = 'DROP POLICY tenant_read ON shop.orders'
verdict = "reject"
reason = "statement_not_allowed: DROP"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "drop_table"
sql = 'DROP TABLE shop.orders'
verdict = "reject"
reason = "statement_not_allowed: DROP"

[[case]]
id = "create_table_as"
sql = 'CREATE TABLE stolen AS SELECT * FROM shop.customers'
verdict = "reject"
reason = "statement_not_allowed: CREATE TABLE AS"

[[case]]
id = "insert_audit"
sql = '''INSERT INTO audit.tool_calls (tool, verdict, duration_ms) VALUES ('run_query', 'allowed', 1)'''
verdict = "reject"
reason = "statement_not_allowed: INSERT"
db_test = "test_reader_cannot_touch_audit"

[[case]]
id = "set_transaction_read_write"
sql = 'SET TRANSACTION READ WRITE'
verdict = "reject"
reason = "statement_not_allowed: SET"
