id = "commit"
sql = 'COMMIT'
verdict = "reject"
reason = "statement_not_allowed: COMMIT"

[[case]]
id = "rollback"
sql = 'ROLLBACK'
verdict = "reject"
reason = "statement_not_allowed: ROLLBACK"

[[case]]
id = "set_statement_timeout_zero"
sql = 'SET statement_timeout = 0'
verdict = "reject"
reason = "statement_not_allowed: SET"
db_test = "test_reader_sql_cannot_change_its_own_settings"
note = "also closed at the DB layer: set_config is revoked from the reader"

[[case]]
id = "set_statement_timeout_in_attack"
sql = 'SET statement_timeout = 0'
verdict = "reject"
reason = "statement_not_allowed: SET"
db_test = "test_temp_file_limit_holds_even_after_reader_disables_statement_timeout"

[[case]]
id = "set_work_mem"
sql = '''SET work_mem = '64kB' '''
