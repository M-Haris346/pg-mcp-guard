# Top-level statements other than SELECT.

[[case]]
id = "insert"
sql = '''INSERT INTO shop.tenants (id, name) VALUES (gen_random_uuid(), 'x')'''
verdict = "reject"
reason = "statement_not_allowed: INSERT"
db_test = "test_writes_fail_in_the_default_read_only_transaction"

[[case]]
id = "update"
sql = '''UPDATE shop.orders SET status = 'paid' '''
verdict = "reject"
reason = "statement_not_allowed: UPDATE"
db_test = "test_writes_fail_in_the_default_read_only_transaction"

[[case]]
id = "delete"
sql = 'DELETE FROM shop.order_items'
verdict = "reject"
reason = "statement_not_allowed: DELETE"
db_test = "test_writes_fail_in_the_default_read_only_transaction"

[[case]]
id = "truncate"
sql = 'TRUNCATE shop.orders'
verdict = "reject"
reason = "statement_not_allowed: TRUNCATE"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "merge"
sql = 'MERGE INTO orders o USING customers c ON o.customer_id = c.id WHEN MATCHED THEN DELETE'
verdict = "reject"
reason = "statement_not_allowed: MERGE"

[[case]]
id = "create_table_shop"
sql = 'CREATE TABLE shop.x (id int)'
verdict = "reject"
reason = "statement_not_allowed: CREATE TABLE"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "create_table_public"
sql = 'CREATE TABLE public.x (id int)'
verdict = "reject"
reason = "statement_not_allowed: CREATE TABLE"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "create_temp_table"
sql = 'CREATE TEMP TABLE x (id int)'
verdict = "reject"
reason = "statement_not_allowed: CREATE TABLE"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "create_function"
sql = '''CREATE FUNCTION shop.f() RETURNS int LANGUAGE sql AS 'SELECT 1' '''
verdict = "reject"
reason = "statement_not_allowed: CREATE FUNCTION"
db_test = "test_writes_still_fail_on_privileges_in_a_read_write_transaction"

[[case]]
id = "alter_table_disable_rls"
sql = 'ALTER TABLE shop.orders DISABLE ROW LEVEL SECURITY'
verdict = "reject"
reason = "statement_not_allowed: ALTER TABLE"
