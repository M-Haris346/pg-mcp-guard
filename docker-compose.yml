services:
  db:
    # postgres:18.6 (multi-arch index digest). Same major as pglast 8.7's bundled
    # parser (PG 18.6), so the validator parses with the server's grammar.
    # Pinned by digest: a tag can be moved, a digest cannot (ADR 0001).
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by db/bootstrap/00_bootstrap.sh on first start.
      MCP_MIGRATOR_PASSWORD: ${MCP_MIGRATOR_PASSWORD:?set MCP_MIGRATOR_PASSWORD in .env}
      MCP_READER_PASSWORD: ${MCP_READER_PASSWORD:?set MCP_READER_PASSWORD in .env}
      MCP_AUDITOR_PASSWORD: ${MCP_AUDITOR_PASSWORD:?set MCP_AUDITOR_PASSWORD in .env}
    ports:
      # Loopback only: the dev database is never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG 18 images keep data in /var/lib/postgresql/18/docker; mount the parent
      # so a future major upgrade can live alongside it.
      - pgdata:/var/lib/postgresql
      # Runs only when the data volume is empty (first start).
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
