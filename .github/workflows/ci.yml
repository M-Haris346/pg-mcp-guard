name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        # postgres:18.6, pinned by digest (same image as docker-compose.yml).
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # Throwaway credential for the ephemeral CI database only.
          POSTGRES_PASSWORD: postgres-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      # Throwaway credentials for the ephemeral CI database only.
      MCP_MIGRATOR_PASSWORD: migrator-ci-only
      MCP_READER_PASSWORD: reader-ci-only
      MCP_AUDITOR_PASSWORD: auditor-ci-only
      TEST_MIGRATOR_DATABASE_URL: postgresql://mcp_migrator:migrator-ci-only@127.0.0.1:5432/mcpguard_test
      TEST_READER_DATABASE_URL: postgresql://mcp_reader:reader-ci-only@127.0.0.1:5432/mcpguard_test
      TEST_AUDITOR_DATABASE_URL: postgresql://mcp_auditor:auditor-ci-only@127.0.0.1:5432/mcpguard_test

    steps:
      # Pinned to full commit SHAs (a tag can be moved; a SHA cannot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      # Service containers cannot mount /docker-entrypoint-initdb.d, so run the
      # same bootstrap script directly as the superuser. The test suite then
      # migrates and seeds mcpguard_test itself.
      - name: Bootstrap database roles
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres-ci-only
        run: bash db/bootstrap/00_bootstrap.sh

      - name: Test
        run: uv run pytest -v
